name: SonarCloud analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check SONAR_TOKEN availability
        id: check_token
        env:
          SONAR_TOKEN: ${{ secrets.ISSUES_TOOL }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN not available — skipping SonarCloud analysis (normal for Dependabot/fork PRs)"
          fi

      - name: Analyze with SonarCloud
        if: steps.check_token.outputs.has_token == 'true'
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.ISSUES_TOOL }}
        with:
          args: >
            -Dsonar.projectKey=amokprime_sonar-issue-exporter
            -Dsonar.organization=amokprime
            -Dsonar.scm.provider=git
